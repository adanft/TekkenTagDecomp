name: Tekken Tag Tournament (USA) (SLUS-20001)
sha1: c7ad9a022bdc836827a0cc093f91b4281836f2bb
options:
  basename: SLUS_200.01
  target_path: iso/SLUS_200.01
  elf_path: build/SLUS_200.01.elf
  # Names, one file per library or game module in address order (docs/decomp_guide.md, "Naming"). configure.py
  # refuses to run unless this lists exactly the files in config/symbols/.
  symbol_addrs_path:
    - config/symbols/game_render_fighter_a.txt
    - config/symbols/game_vu1_packet.txt
    - config/symbols/game_dma_gif.txt
    - config/symbols/game_geometry.txt
    - config/symbols/libvu0.txt
    - config/symbols/game_scene3d.txt
    - config/symbols/game_theater.txt
    - config/symbols/game_draw_list.txt
    - config/symbols/crt0.txt
    - config/symbols/game_main.txt
    - config/symbols/game_battle_mode.txt
    - config/symbols/game_rng_misc.txt
    - config/symbols/game_dma_spr.txt
    - config/symbols/game_memcard.txt
    - config/symbols/game_font_tex.txt
    - config/symbols/game_fighter_setup.txt
    - config/symbols/game_battle_flow.txt
    - config/symbols/game_sound.txt
    - config/symbols/game_fight_misc.txt
    - config/symbols/game_practice.txt
    - config/symbols/game_fighter_core.txt
    - config/symbols/game_camera_stage.txt
    - config/symbols/game_pad.txt
    - config/symbols/game_file.txt
    - config/symbols/game_gfx.txt
    - config/symbols/game_zsort.txt
    - config/symbols/game_sound_if.txt
    - config/symbols/game_screenshot.txt
    - config/symbols/game_movie.txt
    - config/symbols/game_effects.txt
    - config/symbols/game_effects_draw.txt
    - config/symbols/game_loading_title.txt
    - config/symbols/game_menu_common.txt
    - config/symbols/game_options.txt
    - config/symbols/game_pause_results.txt
    - config/symbols/game_modes.txt
    - config/symbols/game_select_results.txt
    - config/symbols/game_sprite2d.txt
    - config/symbols/game_model_anim.txt
    - config/symbols/game_model_draw.txt
    - config/symbols/game_demo.txt
    - config/symbols/game_menu_bg.txt
    - config/symbols/game_gallery_jpeg.txt
    - config/symbols/game_tekken_bowl.txt
    - config/symbols/libcdvd.txt
    - config/symbols/libdma.txt
    - config/symbols/libgraph.txt
    - config/symbols/libmpeg.txt
    - config/symbols/libipu.txt
    - config/symbols/libkernl.txt
    - config/symbols/libpkt.txt
    - config/symbols/librspu2.txt
    - config/symbols/libpad.txt
    - config/symbols/libmtap.txt
    - config/symbols/libmc.txt
    - config/symbols/libm.txt
    - config/symbols/libgcc.txt
    - config/symbols/libc.txt
    - config/symbols/data.txt
  base_path: ..
  platform: ps2
  compiler: EEGCC

  # _start loads gp with 0x5FD0F0 (also the gp value in .reginfo): .lit4 start + 0x7FF0.
  gp_value: 0x005FD0F0
  ld_gp_expression: main_LIT4_START + 0x7FF0

  ld_script_path: build/SLUS_200.01.ld
  ld_dependencies: False
  ld_wildcard_sections: True
  ld_bss_contains_common: True

  create_asm_dependencies: False
  generate_asm_macros_files: False
  find_file_boundaries: False
  o_as_suffix: True

  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .lit4, .sdata, .sbss, .bss]
  auto_link_sections: [.data, .rodata, .lit4, .sdata, .sbss, .bss]

# The whole file is split, so linking it and flattening it with objcopy gives back the original ELF byte for byte:
# the ELF header and program headers, the loaded image (file offset + 0x33F000 = address) and the unloaded tail.
segments:
  - name: header
    type: code
    start: 0x0
    vram: 0x0033F000
    subsegments:
      - [0x0, databin, elf_header]
  - name: main
    type: code
    start: 0x1000
    vram: 0x00340000
    # .sbss starts at 0x5F6B00 and .bss ends at 0x1FCDEF0; configure.py aligns the bss to 64 like the original.
    bss_size: 0x19D7400
    subsegments:
      # C files cover whole objects. A boundary must be a multiple of 16 (the linker script aligns every object to
      # 16) at the start of a function.
      - [0x1000, c, 340000]
      - [0x1B30, asm]
      - [0xD6700, data] # .data
      # .vudata 0x4F5F00: four VU microcode packets (DMA chains for VIF0/VIF1). configure.py builds this object
      # from the listings in src/vu0 and src/vu1 (scripts/vuasm.py) instead of the split file.
      - [0x1B6F00, data, vudata]
      - [0x1BBF70, data] # rest of .vudata: VIF1 code blocks copied and patched by the game (0x4FAF80)
      - [0x1BC880, rodata]
      - [0x2B6100, lit4]
      - [0x2B6C00, sdata]
      - { type: sbss, vram: 0x005F6B00 }
      - { type: bss, vram: 0x005F7180 }
  # Not loaded: zero padding, .reginfo, the VU overlay sections (.DVP.*), section names and section headers.
  # The generated linker script pads every segment to 16 bytes, so it starts after the 12 zero bytes that
  # follow .sdata (0x2B7AE4). Its own RAM id keeps address 0 out of the range searched for pointers.
  - name: trailer
    type: code
    start: 0x2B7AF0
    vram: 0x0
    exclusive_ram_id: elf_trailer
    subsegments:
      - [0x2B7AF0, databin, elf_trailer]
  - [0x2BD980]
