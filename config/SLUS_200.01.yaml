  base_path: ..
  platform: ps2
  compiler: EEGCC

  # _start loads gp with 0x5FD0F0 (also the gp value in .reginfo): .lit4 start + 0x7FF0.
  gp_value: 0x005FD0F0
  ld_gp_expression: main_LIT4_START + 0x7FF0

  ld_script_path: build/SLUS_200.01.ld
  ld_dependencies: False
  ld_wildcard_sections: True
  ld_bss_contains_common: True

  create_asm_dependencies: False
  generate_asm_macros_files: False
  find_file_boundaries: False
  o_as_suffix: True

  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .lit4, .sdata, .sbss, .bss]
  auto_link_sections: [.data, .rodata, .lit4, .sdata, .sbss, .bss]

# The whole file is split, so linking it and flattening it with objcopy gives back the original ELF byte for byte:
# the ELF header and program headers, the loaded image (file offset + 0x33F000 = address) and the unloaded tail.
segments:
  - name: header
    type: code
    start: 0x0
    vram: 0x0033F000
    subsegments:
      - [0x0, databin, elf_header]
  - name: main
    type: code
    start: 0x1000
    vram: 0x00340000
    # .sbss starts at 0x5F6B00 and .bss ends at 0x1FCDEF0; configure.py aligns the bss to 64 like the original.
    bss_size: 0x19D7400
    subalign: null
    subsegments:
      # C files cover whole objects. With `subalign: null` every object keeps its own section alignment (8 for
      # .text), as in the original link: a boundary is the start of a function, a multiple of 8.
      - [0x1000, c, render_fighter_a]
      - [0x2B28, c, render_fighter_b]
      - [0x30C8, c, vu1_packet]
      - [0x3E78, c, dma_gif]
      - [0x7398, c, geometry]
      - [0x8760, c, geometry_b]
      - [0xB7A8, asm] # libvu0
      - [0xC4E8, c, geometry_c]
